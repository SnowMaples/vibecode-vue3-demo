<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Demo</title>
    <script src="https://unpkg.com/vue@3.3.4/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { background: #f5f5f5; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .header h1 { margin: 0; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .form-group textarea { height: 100px; resize: vertical; }
        .btn { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .item-list { margin-top: 20px; }
        .item { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 4px; }
        .item h3 { margin: 0 0 10px 0; }
        .item p { margin: 5px 0; color: #666; }
        .item .meta { font-size: 12px; color: #999; margin-top: 10px; }
        .actions { margin-top: 10px; }
        .actions button { margin-right: 5px; }
        .loading { text-align: center; padding: 20px; color: #666; }
        .empty-state { text-align: center; padding: 40px; color: #999; }
    </style>
</head>
<body>
    <div id="app" class="container">
        <div class="header">
            <h1>CRUD Demo Application</h1>
            <p>A simple CRUD application with SQLite database</p>
        </div>
        
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" v-model="form.name" placeholder="Enter item name">
        </div>
        
        <div class="form-group">
            <label for="description">Description:</label>
            <textarea id="description" v-model="form.description" placeholder="Enter item description"></textarea>
        </div>
        
        <div class="form-group">
            <button class="btn" @click="saveItem" :disabled="loading">
                {{ editing ? 'Update Item' : 'Create Item' }}
            </button>
            <button class="btn btn-danger" @click="resetForm" v-if="editing">Cancel</button>
        </div>
        
        <div class="item-list">
            <div v-if="loading" class="loading">
                Loading items...
            </div>
            
            <div v-else-if="items.length === 0" class="empty-state">
                No items found. Create your first item!
            </div>
            
            <div v-else class="item" v-for="item in items" :key="item.id">
                <h3>{{ item.name }}</h3>
                <p>{{ item.description }}</p>
                <div class="meta">
                    Created: {{ formatDate(item.createdAt) }} | 
                    Updated: {{ formatDate(item.updatedAt) }}
                </div>
                <div class="actions">
                    <button class="btn" @click="editItem(item)">Edit</button>
                    <button class="btn btn-danger" @click="deleteItem(item.id)">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        const app = createApp({
            data() {
                return {
                    items: [],
                    form: {
                        id: null,
                        name: '',
                        description: ''
                    },
                    loading: false,
                    editing: false
                };
            },
            mounted() {
                this.loadItems();
            },
            methods: {
                async loadItems() {
                    this.loading = true;
                    try {
                        const response = await axios.get('/api/items');
                        this.items = response.data;
                    } catch (error) {
                        console.error('Error loading items:', error);
                    } finally {
                        this.loading = false;
                    }
                },
                
                async saveItem() {
                    if (!this.form.name.trim()) {
                        alert('Name is required');
                        return;
                    }
                    
                    try {
                        if (this.editing) {
                            await axios.put(`/api/items/${this.form.id}`, {
                                name: this.form.name,
                                description: this.form.description
                            });
                        } else {
                            await axios.post('/api/items', {
                                name: this.form.name,
                                description: this.form.description
                            });
                        }
                        this.resetForm();
                        this.loadItems();
                    } catch (error) {
                        console.error('Error saving item:', error);
                        alert('Error saving item');
                    }
                },
                
                editItem(item) {
                    this.form = { ...item };
                    this.editing = true;
                },
                
                async deleteItem(id) {
                    if (!confirm('Are you sure you want to delete this item?')) {
                        return;
                    }
                    
                    try {
                        await axios.delete(`/api/items/${id}`);
                        this.loadItems();
                    } catch (error) {
                        console.error('Error deleting item:', error);
                        alert('Error deleting item');
                    }
                },
                
                resetForm() {
                    this.form = { id: null, name: '', description: '' };
                    this.editing = false;
                },
                
                formatDate(dateString) {
                    const date = new Date(dateString);
                    return date.toLocaleString();
                }
            }
        });
        
        app.mount('#app');
    </script>
</body>
</html>
